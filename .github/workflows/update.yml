name: Uppdatera Löven-kollen

on:
  schedule:
    - cron: "7,37 * * * *"   # var 30:e minut
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: loven-kollen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null && node scripts/probe.mjs || true
      - name: Hämta ny data
        run: node scripts/update.mjs
      - name: Spara ändringar
        id: commit
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "loven-kollen-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Uppdatera data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Förbered sidan
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: mkdir -p _site && cp index.html data.json _site/
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
